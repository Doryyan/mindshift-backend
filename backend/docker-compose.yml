version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mindshift
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/mindshift
      DATABASE_URL_SYNC: postgresql+psycopg2://postgres:postgres@db:5432/mindshift
      USE_SQLITE: "false"
      AI_API_KEY: ${AI_API_KEY:-}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python seed_data.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  pgdata:
